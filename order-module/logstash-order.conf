input {
  file {
    path => "/Users/allen/zoom/projects/order-system-micro/order-module/logs/order-module.log"
    codec => "json"
    start_position => "begin"
    sincedb_path => "/dev/null"
  }
}

filter {
  # 仅处理包含 "ELK_OPERATION_LOG" 的日志行
  if [message] =~ "ELK_OPERATION_LOG" {
    # 去掉前缀 "ELK_OPERATION_LOG "，得到纯 JSON
    mutate {
      gsub => ["message", "^ELK_OPERATION_LOG ", ""]
    }
    # 解析 JSON
    json {
      source => "message"
      target => "parsed"
    }
    # 将解析后的字段提升到根级别
    mutate {
      add_field => {
        "id"          => "%{[parsed][id]}"
        "trackingId"  => "%{[parsed][trackingId]}"
        "userId"      => "%{[parsed][userId]}"
        "username"    => "%{[parsed][username]}"
        "operation"   => "%{[parsed][operation]}"
        "details"     => "%{[parsed][details]}"
        "ipAddress"   => "%{[parsed][ipAddress]}"
        "userAgent"   => "%{[parsed][userAgent]}"
        "operationTime" => "%{[parsed][operationTime]}"
      }
      remove_field => ["parsed", "message", "@version", "host", "path"]
    }
    date {
      match => ["operationTime", "yyyy-MM-dd HH:mm:ss"]
      target => "operationTime"
    }
  } else {
    drop { }
  }
}

output {
  elasticsearch {
    hosts => ["localhost:9200"]
    index => "order-operations"
    document_id => "%{id}"   # 使用相同的 id，实现覆盖（幂等）
  }
  stdout { codec => rubydebug }
}