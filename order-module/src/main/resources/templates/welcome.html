<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎页 - 订单系统</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem 4rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }
        h1 {
            font-size: 3rem;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
        }
        .btn-login {
            display: inline-block;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 12px 32px;
            font-size: 1.2rem;
            border: none;
            border-radius: 40px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            background: linear-gradient(45deg, #5a67d8, #6b46a0);
        }
        .features {
            margin-top: 2rem;
            display: flex;
            gap: 2rem;
            justify-content: center;
            color: #555;
        }
        .features span {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📦 订单管理系统</h1>
    <div class="subtitle">高效 · 简洁 · 安全</div>
    <a href="/login" class="btn-login">🔐 登录系统</a>
    <div class="features">
        <span>✅ 在线下单</span>
        <span>✅ 订单管理</span>
        <span>✅ 实时缓存</span>
    </div>
</div>
</body>
</html>
