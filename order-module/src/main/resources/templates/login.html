<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 订单系统</title>
    <style>
        body { font-family: Arial; margin: 50px; }
        .container { width: 300px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input { width: 100%; padding: 8px; margin: 5px 0 15px; box-sizing: border-box; }
        button { width: 100%; padding: 8px; background: #007bff; color: white; border: none; cursor: pointer; }
        .error { color: red; }
    </style>
</head>
<body>
<div class="container">
    <h2>用户登录</h2>
    <form method="post" th:action="@{/login}">
        <label>用户名：</label>
        <input type="text" name="username" required autofocus/>
        <label>密码：</label>
        <input type="password" name="password" required/>
        <button type="submit">登录</button>
        <p th:if="${error}" class="error" th:text="${error}"></p>
    </form>
    <p>测试账号：admin / 123456 或 test / test123</p>
</div>
</body>
</html>
